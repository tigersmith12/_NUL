name: Check branch, PR & version naming

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore:
      - main
      - Initial-reference
      - v1
    tags:
      - "v*"

permissions:
  contents: read
  pull-requests: read

jobs:
  naming:
    name: Validate branch, PR title & version sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run naming & integrity tests
        run: npm test

      - name: Validate active branch, PR title & version alignment
        run: node scripts/check-naming.mjs
